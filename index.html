<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>판재 도면기</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
/* VIVIVIC 공통 톤 (에이엠티/조혼가구 화면과 동일) */
:root{ --ink:#37352f; --muted:#787774; --faint:#b0aeaa; --line:#ededeb; --bg:#ffffff; --soft:#f7f6f3; --softer:#f1f1ef; --card:#fbfbfa;
       --accent:#37352f; --scene-bg:#fbfbfa; --board:#d9c9a6; --grid:#e3e2e0; }
html{color-scheme:light}
body{ font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo",Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased; margin:0; }
.custom-scrollbar::-webkit-scrollbar{width:4px;height:14px}
.custom-scrollbar::-webkit-scrollbar-track{background:#f1f1ef;border-radius:10px}
.custom-scrollbar::-webkit-scrollbar-thumb{background:#d3d1cb;border-radius:10px}
.nav-link{padding:8px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted);transition:all .2s;cursor:pointer;white-space:nowrap}
.nav-link:hover{background:var(--soft);color:var(--ink)}
.nav-link.active{background:var(--softer);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.notion-card{border:1px solid var(--line);border-radius:10px;background:#fff}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace}
/* 입력표 */
.sheet table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.sheet th{text-align:left;font-size:10px;font-weight:700;color:var(--muted);padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.sheet td{padding:3px 3px;border-bottom:1px solid var(--line)}
.sheet tr:hover td{background:var(--soft)}
.sheet tr.sel td{background:var(--softer)}
.sheet input{width:100%;font:inherit;font-size:13px;padding:7px 8px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--ink);outline:none}
.sheet input:hover{border-color:var(--line)}
.sheet input:focus{border-color:var(--ink);background:#fff}
.sheet td.num input{text-align:right;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:600;-moz-appearance:textfield;appearance:textfield}
.sheet td.num input::-webkit-outer-spin-button,.sheet td.num input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sheet td.act{text-align:right;white-space:nowrap}
.sheet td.act button{padding:4px 7px;border-radius:6px;color:var(--faint);font-weight:700;font-size:11px;background:transparent;border:0;cursor:pointer}
.sheet td.act button:hover{background:var(--softer);color:var(--ink)}
/* 3D 화면 */
.view{position:relative;background:var(--scene-bg);border-radius:10px;overflow:hidden}
.view canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hud .tools,.hud .views{display:inline-flex;gap:2px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:2px}
.hud .tools button,.hud .views button{font:inherit;font-size:11px;font-weight:700;padding:4px 9px;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.hud .tools button:hover,.hud .views button:hover{background:var(--soft);color:var(--ink)}
.hud .tools button.on{background:var(--ink);color:#fff}
.hud #btnFit{font:inherit;font-size:11px;font-weight:700;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}
.hud #btnFit:hover{background:var(--soft)}
.legend{position:absolute;left:10px;bottom:10px;color:var(--faint);font-size:10px;font-weight:600}
.info{position:absolute;right:10px;bottom:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:180px;font-size:12px;line-height:1.7;box-shadow:0 4px 12px -4px rgba(0,0,0,.08)}
.info b{display:block;font-weight:800;font-size:13px;margin-bottom:2px}
.info .k{font-size:10px;font-weight:700;color:var(--muted);margin-right:2px}
.info .v{font-family:ui-monospace,Menlo,monospace;font-weight:600;margin-right:8px}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
@media (max-width:900px){ .layout{grid-template-columns:1fr!important} .view{height:52vh!important} }
</style>
</head>
<body>

<header class="w-full bg-white border-b border-[#ededeb] sticky top-0 z-[100]">
  <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between overflow-x-auto custom-scrollbar">
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2 mr-4">
        <div class="font-black text-xl tracking-tighter text-[#37352f]">VIVIVIC</div>
        <span class="mono" style="font-size:9px;font-weight:700;color:#b0aeaa;background:#f1f0ef;padding:1px 6px;border-radius:4px;letter-spacing:0.04em;">v0.3.0</span>
      </div>
      <nav class="flex items-center gap-1">
        <div class="nav-link active">판재 도면</div>
      </nav>
    </div>
    <div class="flex items-center gap-2 ml-4">
      <button id="btnClear" class="flex items-center gap-1.5 px-3 py-2 bg-[#f7f6f3] text-[#37352f] border border-[#ededeb] rounded-lg text-[11px] font-bold hover:bg-[#f1f1ef] transition-all active:scale-95 whitespace-nowrap">모두 지우기</button>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 mt-6 pb-10">
  <div class="layout grid gap-4" style="grid-template-columns:340px 1fr;">
    <!-- 입력 -->
    <div class="notion-card bg-[#fbfbfa] p-5 flex flex-col gap-4" style="align-self:start;">
      <div>
        <div class="font-black text-[15px] text-[#37352f]">부품 치수</div>
        <p class="text-[11px] text-[#787774] mt-1">치수를 넣으면 오른쪽에 바로 그려집니다. 단위는 <b>mm</b>.</p>
      </div>
      <div class="sheet notion-card overflow-hidden">
        <table id="sheet">
          <thead><tr>
            <th>부품명</th>
            <th style="width:74px;text-align:right">가로</th>
            <th style="width:74px;text-align:right">세로</th>
            <th style="width:64px;text-align:right">두께</th>
            <th style="width:34px"></th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <button id="btnAdd" class="w-full py-2.5 bg-[#37352f] text-white font-bold text-[13px] rounded-lg hover:bg-black transition-all active:scale-95">+ 판 추가</button>
      <p class="text-[10px] text-[#b0aeaa] font-semibold">판은 바닥에 눕혀서 왼쪽부터 나란히 놓입니다.</p>
    </div>

    <!-- 3D -->
    <div class="notion-card p-2">
      <div class="view" style="height:calc(100vh - 140px);min-height:420px;">
        <canvas id="c"></canvas>
        <div class="hud">
          <span class="tools">
            <button data-tool="select" title="선택 (Space)">선택</button>
            <button data-tool="orbit" title="궤도 (O)">궤도</button>
            <button data-tool="pan" title="이동 (H)">이동</button>
            <button data-tool="zoom" title="확대/축소 (Z)">확대</button>
          </span>
          <span class="views">
            <button data-view="iso">등각</button>
            <button data-view="front">정면</button>
            <button data-view="side">측면</button>
            <button data-view="top">평면</button>
          </span>
          <button id="btnFit" title="범위 맞춤 (Shift+Z)">맞춤</button>
        </div>
        <div class="legend">휠버튼 드래그 궤도 · Shift+휠버튼 이동 · 휠 확대 · 클릭 선택 · Space / O / H / Z · Shift+Z 맞춤</div>
        <div class="info" id="info" hidden></div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- 데이터 ----------
const DEFAULT = [{name:'상판', w:600, h:400, t:18}];
let parts = [];
try{ const s = localStorage.getItem('panel-drafter-v2'); if(s) parts = JSON.parse(s); }catch(e){}
if(!parts.length) parts = DEFAULT.map(p=>({...p}));
function save(){ try{ localStorage.setItem('panel-drafter-v2', JSON.stringify(parts)); }catch(e){} }
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// ---------- 표 ----------
const tbody = document.getElementById('rows');
let selected = -1;
function renderRows(){
  tbody.innerHTML = '';
  parts.forEach((p,i)=>{
    const tr = document.createElement('tr'); tr.dataset.i = i; if(i===selected) tr.classList.add('sel');
    tr.innerHTML = `
      <td><input class="name" data-k="name" value="${esc(p.name)}" placeholder="부품명"></td>
      <td class="num"><input data-k="w" type="number" min="1" value="${p.w}"></td>
      <td class="num"><input data-k="h" type="number" min="1" value="${p.h}"></td>
      <td class="num"><input data-k="t" type="number" min="1" value="${p.t}"></td>
      <td class="act"><button data-act="del" title="삭제">✕</button></td>`;
    tbody.appendChild(tr);
  });
}
tbody.addEventListener('input', e=>{
  const tr = e.target.closest('tr'); const p = parts[+tr.dataset.i]; const k = e.target.dataset.k; if(!p||!k) return;
  p[k] = e.target.type==='number' ? (Number(e.target.value)||0) : e.target.value;
  save(); build();
});
tbody.addEventListener('click', e=>{
  const tr = e.target.closest('tr'); if(!tr) return; const i = +tr.dataset.i;
  if(e.target.dataset.act==='del'){ parts.splice(i,1); selected=-1; save(); renderRows(); build(); return; }
  select(i);
});
document.getElementById('btnAdd').onclick = ()=>{
  const last = parts[parts.length-1] || DEFAULT[0];
  parts.push({name:'판 '+(parts.length+1), w:last.w, h:last.h, t:last.t}); save(); renderRows(); build(); fit();
  tbody.lastElementChild.querySelector('input').select();
};
document.getElementById('btnClear').onclick = ()=>{ if(parts.length && !confirm('표를 모두 지울까요?')) return; parts=[]; selected=-1; save(); renderRows(); build(); };

// ---------- 3D ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 1, 100000);
camera.up.set(0,0,1);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f98, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.55); sun.position.set(-600, -900, 1400); scene.add(sun);

const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
let group = new THREE.Group(); scene.add(group);
let helpers = new THREE.Group(); scene.add(helpers);
const pickables = [];
function colorOf(k){ return new THREE.Color(css(k)); }
function buildHelpers(){
  helpers.clear();
  const g = new THREE.GridHelper(2000, 40, colorOf('--grid'), colorOf('--grid')); g.rotation.x = Math.PI/2; g.position.z = -0.5; helpers.add(g);
  const mk = (dir,col)=>{ const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), dir.clone().multiplyScalar(1000)]); helpers.add(new THREE.Line(geo, new THREE.LineBasicMaterial({color:col}))); };
  mk(new THREE.Vector3(1,0,0),0xd0433a); mk(new THREE.Vector3(0,1,0),0x3a9a4a); mk(new THREE.Vector3(0,0,1),0x2f5fc4);
}
const GAP = 100;
function build(){
  scene.background = colorOf('--scene-bg');
  group.clear(); pickables.length = 0;
  const board = colorOf('--board');
  const edgeC = new THREE.Color(css('--ink')).lerp(colorOf('--scene-bg'), 0.45);
  let x = 0;
  parts.forEach((p,i)=>{
    if(!(p.w>0&&p.h>0&&p.t>0)) return;
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(p.w,p.h,p.t), new THREE.MeshLambertMaterial({color:board}));
    mesh.position.set(x+p.w/2, p.h/2, p.t/2);   // 바닥에 눕혀서 왼쪽부터 나란히
    mesh.userData.i = i; group.add(mesh); pickables.push(mesh);
    mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry), new THREE.LineBasicMaterial({color:edgeC})));
    x += p.w + GAP;
  });
  highlight();
}
function highlight(){
  pickables.forEach(m=>{ m.material.emissive = new THREE.Color(m.userData.i===selected ? css('--accent') : '#000000'); m.material.emissiveIntensity = 0.35; });
}
function select(i){
  selected = (selected===i) ? -1 : i;
  [...tbody.children].forEach((tr,k)=>tr.classList.toggle('sel', k===selected));
  highlight();
  const info = document.getElementById('info');
  if(selected<0){ info.hidden = true; return; }
  const p = parts[selected];
  info.hidden = false;
  info.innerHTML = `<b>${esc(p.name)}</b><span class="k">가로</span><span class="v">${p.w}</span><span class="k">세로</span><span class="v">${p.h}</span><span class="k">두께</span><span class="v">${p.t}</span>`;
}

// ---------- 카메라 조작 (SketchUp 방식) ----------
// 휠 = 커서 쪽으로 확대/축소 · 휠버튼 드래그 = 궤도(커서 아래 점 기준) · Shift+휠버튼 = 이동
// 도구: Space 선택 · O 궤도 · H 이동 · Z 확대 · Shift+Z 범위 맞춤 · Esc 선택으로
const target = new THREE.Vector3(300,200,360);
camera.position.set(900,-1100,800);
function updateCam(){ camera.lookAt(target); }
const view = document.querySelector('.view');
let tool = 'select';
const CURSOR = {select:'default', orbit:'grab', pan:'move', zoom:'zoom-in'};
function setTool(t){ tool = t; view.style.cursor = CURSOR[t]; document.querySelectorAll('.hud [data-tool]').forEach(b=>b.classList.toggle('on', b.dataset.tool===t)); }
document.querySelectorAll('.hud [data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));

function bounds(){
  const b = new THREE.Box3(); pickables.forEach(m=>b.expandByObject(m));
  if(b.isEmpty()) b.set(new THREE.Vector3(-300,-300,0), new THREE.Vector3(300,300,300)); return b;
}
function fit(){ // 범위 맞춤: 보는 방향은 유지
  const dir = camera.position.clone().sub(target).normalize();
  const b = bounds(); b.getCenter(target);
  const size = b.getSize(new THREE.Vector3()).length();
  const dist = size / (2*Math.tan(camera.fov*Math.PI/360)) * 1.1;
  camera.position.copy(target).addScaledVector(dir, dist); updateCam();
}
const VIEWS = { iso:[1,-1,0.8], front:[0,-1,0], side:[1,0,0], top:[0,-0.0001,1] };
document.querySelectorAll('.hud [data-view]').forEach(b=>b.onclick=()=>{
  const d = camera.position.distanceTo(target);
  camera.position.copy(target).addScaledVector(new THREE.Vector3(...VIEWS[b.dataset.view]).normalize(), d); fit();
});
document.getElementById('btnFit').onclick = fit;

const ray = new THREE.Raycaster();
function ndc(e){ const r = canvas.getBoundingClientRect(); return new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1); }
function pointUnder(e){ // 커서 아래의 3D 점: 부품이 있으면 그 표면, 없으면 바닥 평면
  ray.setFromCamera(ndc(e), camera);
  const hit = ray.intersectObjects(pickables)[0]; if(hit) return hit.point;
  const p = new THREE.Vector3(); if(ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,0,1), 0), p)) return p;
  return target.clone();
}
function orbit(dx, dy, pivot){
  const yaw = -dx*0.005, pitch = -dy*0.005;
  const rot = (axis, ang)=>{ camera.position.sub(pivot).applyAxisAngle(axis, ang).add(pivot); target.sub(pivot).applyAxisAngle(axis, ang).add(pivot); };
  rot(new THREE.Vector3(0,0,1), yaw);
  const dir = target.clone().sub(camera.position).normalize();
  const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,0,1)).normalize();
  const elev = Math.asin(THREE.MathUtils.clamp(dir.z,-1,1));
  const next = elev + pitch; // 위아래로 넘어가지 않게
  if(next > -1.55 && next < 1.55) rot(right, pitch);
  updateCam();
}
function pan(dx, dy){
  const d = camera.position.distanceTo(target), s = d*2*Math.tan(camera.fov*Math.PI/360)/canvas.clientHeight;
  const dir = camera.getWorldDirection(new THREE.Vector3());
  const right = new THREE.Vector3().crossVectors(dir, camera.up).normalize();
  const up = new THREE.Vector3().crossVectors(right, dir).normalize();
  const v = right.multiplyScalar(-dx*s).addScaledVector(up, dy*s);
  camera.position.add(v); target.add(v); updateCam();
}
function zoomAt(e, factor){ // factor<1 확대: 커서 아래 점을 향해 접근
  const p = pointUnder(e);
  const v = p.clone().sub(camera.position).multiplyScalar(1-factor);
  const d = camera.position.distanceTo(p);
  if(factor<1 && d*factor < 30) return;
  camera.position.add(v); target.add(v); updateCam();
}

let drag = null;
canvas.addEventListener('contextmenu', e=>e.preventDefault());
canvas.addEventListener('mousedown', e=>{ if(e.button===1) e.preventDefault(); }); // 휠버튼 자동 스크롤 방지
canvas.addEventListener('pointerdown', e=>{
  let mode = null;
  if(e.button===1) mode = e.shiftKey ? 'pan' : 'orbit';
  else if(e.button===0){ mode = tool==='select' ? 'pick' : (tool==='orbit' && e.shiftKey ? 'pan' : tool); }
  else if(e.button===2) mode = 'pan';
  if(!mode) return;
  drag = {x:e.clientX,y:e.clientY,mode,moved:false,pivot: mode==='orbit' ? pointUnder(e) : null};
  if(mode==='orbit') view.style.cursor='grabbing';
  canvas.setPointerCapture(e.pointerId); e.preventDefault();
});
canvas.addEventListener('pointermove', e=>{
  if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY;
  if(Math.abs(dx)+Math.abs(dy)>2) drag.moved=true;
  if(drag.mode==='orbit') orbit(dx, dy, drag.pivot);
  else if(drag.mode==='pan') pan(dx, dy);
  else if(drag.mode==='zoom') zoomAt({clientX:canvas.getBoundingClientRect().left+canvas.clientWidth/2, clientY:canvas.getBoundingClientRect().top+canvas.clientHeight/2}, Math.exp(dy*0.01));
});
canvas.addEventListener('pointerup', e=>{
  if(drag && drag.mode==='pick' && !drag.moved){
    ray.setFromCamera(ndc(e), camera);
    const hit = ray.intersectObjects(pickables)[0];
    if(hit) select(hit.object.userData.i); else if(selected>=0) select(selected);
  }
  drag = null; setTool(tool);
});
canvas.addEventListener('wheel', e=>{ e.preventDefault(); zoomAt(e, Math.exp(e.deltaY*0.0015)); }, {passive:false});
canvas.addEventListener('dblclick', e=>{ if(e.button===0 && tool!=='select'){ const p=pointUnder(e); const v=p.sub(target); camera.position.add(v); target.add(v); updateCam(); } });
window.addEventListener('keydown', e=>{
  if(e.target.matches('input,select,textarea')) return;
  const k = e.key.toLowerCase();
  if(k===' '){ setTool('select'); e.preventDefault(); }
  else if(k==='o') setTool('orbit');
  else if(k==='h') setTool('pan');
  else if(k==='z' && e.shiftKey) fit();
  else if(k==='z') setTool('zoom');
  else if(k==='escape') setTool('select');
});
setTool('select');

function resize(){
  const r = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false); camera.aspect = r.width/r.height; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas.parentElement);

renderRows(); buildHelpers(); build(); resize(); fit();
(function loop(){ renderer.render(scene, camera); requestAnimationFrame(loop); })();
</script>

<!-- 바이글 손잡이 — 주소에 ?viggle=1 이 있을 때만 켜진다 -->
<script src="https://vivivic-cloud.github.io/vivivic-apps/shared/viggle.js"></script>
</body>
</html>
